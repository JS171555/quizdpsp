<!DOCTYPE html>
<html lang="pt-br">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
      <title>QUIZ - Sou Cultura DPSP</title>
      <link rel="stylesheet" href="css/style.css">
      <link rel="icon" href="assets/0004.png" type="image/png">
      <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
      <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
   </head>
   <body class="bg-gradient-to-b from-[#2B5EA7] to-[#0A2A5E] min-h-screen flex items-start justify-center">
      <div class="w-full max-w-[390px] h-[640px] bg-[#145DA0] rounded-[44px] overflow-hidden relative shadow-2xl border-[3px] border-white/20 mt-20 sm:mt-0">
         <div class="absolute inset-0 bg-gradient-to-b from-[#1E5EAB] via-[#0F3D7A] to-[#062450]"></div>
         <div class="relative z-10 w-full h-full flex flex-col text-white">
            <!-- TELA INICIAL -->
            <div id="startScreen" class="flex-1 flex flex-col items-center justify-between px-5 py-8">
               <div class="w-full flex justify-center pt-4">
               </div>
               <div class="flex flex-col items-center animate__animated animate__fadeIn">
                  <div class="w-20 h-20 rounded-full flex items-center justify-center text-white/40 text-sm mb-3">
                     <img src="assets/0004.png" width="90 height=90">
                  </div>
                  <h1 class="text-4xl font-extrabold tracking-tight">DPSP</h1>
                  <p class="text-sm font-medium tracking-wider text-white/80 mt-0">Sou Cultura</p>
               </div>
               <button onclick="startQuiz()"
                  class="bg-white text-[#0A2A5E] w-[90%] py-3 rounded-3xl font-bold text-xl shadow-lg animate-pulse-soft hover:scale-[0.98] active:bg-gray-100 transition">
               Iniciar quiz
               </button>   
            </div>
            <!-- TELA QUIZ -->
            <div id="quizScreen" class="hidden flex-1 flex flex-col px-4 pt-6 pb-4">
               <div class="flex items-center justify-between mb-3">
                  <button onclick="prevQuestion()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition text-2xl"><i class="fa-solid fa-arrow-left"></i></button>
                  <span id="progressText" class="font-semibold text-base">1/10</span>
                  <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white/40 text-[10px]">
                     <img src="assets/0003.gif">
                  </div>
               </div>
               <div class="w-full bg-white/20 rounded-full h-5 mb-4">
                  <div id="progressBar" class="bg-white h-5 rounded-full" style="width:10%"></div>
               </div>
               <div class="bg-[#F5F7FA] text-[#0F3A6B] rounded-3xl p-5 flex-1 flex flex-col justify-between card-shadow">
                  <div>
                     <h2 id="question" class="text-xl font-bold leading-tight mb-5"></h2>
                     <div id="answers" class="space-y-3"></div>
                  </div>
                  <div id="feedbackArea" class="mt-4 mb-2 min-h-[48px]">
                     <div id="feedbackMessage" class="text-sm bg-white/80 backdrop-blur-sm p-3 rounded-xl text-[#0F3A6B] shadow-sm hidden feedback-popup"></div>
                  </div>
                  <div>
                     <!-- Botao prixima -->   <button id="nextBtn" onclick="handleNextOrValidate()" class="w-full bg-gradient-to-r from-[#2B5EA7] to-[#2B5EA7] text-white py-3.5 rounded-2xl font-semibold shadow-md transition hover:opacity-90 disabled:opacity-50">
                     Próxima
                     </button>
                  </div>
               </div>
            </div>
            <!-- TELA RESULTADO -->
            <div id="resultScreen" class="hidden flex-1 flex flex-col px-5 pt-6 pb-5" style="height: 100%;">
               <!-- cabeçalho fixo no topo -->
               <div class="flex justify-center mt-1 mb-2">
                  <div class="w-16 h-16 rounded-full flex items-center justify-center text-white/50 text-xs">
                     <img src="assets/0005.gif">
                  </div>
               </div>
               <h1 class="text-2xl font-bold text-center mb-0.5">Sua classificação</h1>
               <p id="levelMessage" class="text-center text-white/90 text-sm font-medium mb-2 px-2"></p>
               <!-- card de pontuação (compacto) -->
               <div class="bg-gradient-to-r from-[#0C3777] to-[#2364B8] rounded-xl p-3 mb-3 shadow-inner">
                  <p id="scoreDisplay" class="text-2xl font-extrabold text-center"></p>
               </div>
               <!-- ÁREA DE REVISÃO COM SCROLL (altura dinâmica) -->
               <div class="flex-1 min-h-0 mb-3">
                  <div id="review" class="bg-white/5 rounded-xl p-4 text-sm h-full review-scroll border border-white/10">
                     <!-- preenchido via js -->
                  </div>
               </div>
               <!-- Botão RESGATAR sempre visível -->
               <button id="resgateBtn"
                  class="bg-white text-[#0C2F62] w-full py-4 rounded-2xl font-bold text-lg shadow-lg hover:bg-gray-100 transition transform active:scale-[0.98] mt-auto flex items-center justify-center gap-2">
               <img src="assets/0006.gif" class="w-7 h-6" alt="icone">
               RESGATAR
               </button>     
            </div>
            <div id="customAlert" class="fixed inset-0 flex items-center justify-center bg-black/50 opacity-0 pointer-events-none transition">
              <div class=" bg-white rounded-2xl p-6 w-[90%] max-w-md text-center shadow-xl scale-90 transition transform" id="alertBox">
                  <div class=" text-4xl mb-3"><img src="assets/0007.png"></div>
                  <h2 class="text-xl font-bold text-[#0A2A5E] mb-2">
                     Resgate realizado!
                  </h2>
                  <p class="text-gray-600 mb-4">
                     Aguarde seu prêmio simbólico: <strong>Badge "Sou Cultura DPSP"</strong>
                  </p>
                  <button onclick="closeAlert()" 
                     class=" text-[#0A2A5E] px-6 py-2 rounded-xl font-semibold hover:opacity-90 transition">
                  FIM DO QUIZ
                  </button>
               </div>
            </div>
         </div>
      </div>
     <script src="js/script.js"></script>
   </body>
</html>
